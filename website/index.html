<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peachy: Gallery, player and browser for Android</title>
    <meta
      name="description"
      content="Peachy is a local-first Android media workspace: your gallery, player and browser in one app. Media you add is kept in the app's library on your phone. Open source, with limits stated plainly."
    />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link
      rel="preload"
      href="/assets/onest-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link rel="preload" as="image" href="/assets/gallery.webp" type="image/webp" />
    <link rel="prefetch" as="image" href="/assets/player-screen.webp" type="image/webp" />
    <link rel="prefetch" as="image" href="/assets/browser-screen.webp" type="image/webp" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Peachy: Gallery, player and browser for Android" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:description"
      content="A local-first Android media workspace. Your gallery, player and browser in one app, with media kept in the app's library on your phone."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
