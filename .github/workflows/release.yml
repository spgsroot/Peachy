name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-android

      - name: Build AAB and APK
        run: ./gradlew bundleRelease assembleRelease

      - name: Sign APK and AAB with the publisher key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/peachy-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          keystore="$signing_dir/keystore"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore"
          unset SIGNING_KEY

          mkdir -p dist
          zipalign -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$signing_dir/aligned.apk"
          apksigner sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out dist/app-release-unsigned-signed.apk "$signing_dir/aligned.apk"
          jarsigner -keystore "$keystore" -storepass:env KEY_STORE_PASSWORD -keypass:env KEY_PASSWORD \
            -signedjar dist/app-release.aab app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - name: Verify publisher signatures and native packaging
        shell: bash
        env:
          # SHA-256 of the signing certificate in the v3.6.0 APK.
          EXPECTED_CERT: 1a94ec1ea1d58f9e8af06dd24bfddba78b43dc96897751fc8058c6af5c65a744
        run: |
          apk=dist/app-release-unsigned-signed.apk
          aab=dist/app-release.aab
          apk_cert=$(apksigner verify --print-certs "$apk" \
            | awk '/^Signer #[0-9]+ certificate SHA-256 digest: / { print $NF }')
          if [[ "$apk_cert" != "$EXPECTED_CERT" ]]; then
            echo 'APK must have exactly the v3.6.0 publisher signer' >&2
            exit 1
          fi

          # Pin the bundle's leaf certificate, then require all entries to be signed.
          verification_dir=$(mktemp -d "$RUNNER_TEMP/peachy-verification.XXXXXX")
          trap 'rm -rf -- "$verification_dir"' EXIT
          cert="$verification_dir/publisher.pem"
          truststore="$verification_dir/trusted.p12"
          keytool -J-Duser.language=en -printcert -rfc -jarfile "$aab" | awk '
            /^Signer #[0-9]+:/ { signers++ }
            /^-----BEGIN CERTIFICATE-----$/ { certificates++ }
            certificates == 1 && /^-----BEGIN CERTIFICATE-----$/ { capture = 1 }
            capture { print }
            /^-----END CERTIFICATE-----$/ { capture = 0 }
            END { if (signers != 1 || certificates < 1) exit 1 }
          ' > "$cert"
          aab_cert=$(openssl x509 -in "$cert" -outform DER | sha256sum | cut -d ' ' -f 1)
          if [[ "$aab_cert" != "$EXPECTED_CERT" ]]; then
            echo 'AAB signer does not match the v3.6.0 publisher certificate' >&2
            exit 1
          fi
          keytool -importcert -noprompt -alias publisher -file "$cert" \
            -keystore "$truststore" -storetype PKCS12 -storepass changeit
          jarsigner -verify -strict -keystore "$truststore" -storepass changeit "$aab" publisher

          zipalign -c -P 16 4 "$apk"
          python3 tools/adblock/verify-apk.py "$apk"
          python3 - "$apk" "$aab" <<'PY'
          import sys
          from zipfile import ZipFile

          def native_headers(path, prefix):
              headers = {}
              with ZipFile(path) as archive:
                  for entry in archive.infolist():
                      if entry.filename.startswith(prefix) and entry.filename.endswith(".so"):
                          name = entry.filename[len(prefix):]
                          if name in headers:
                              sys.exit(f"{path}: duplicate native entry {name}")
                          with archive.open(entry) as library:
                              # Include ELF magic, class and e_machine, not the library payload.
                              headers[name] = library.read(20)
              return headers

          apk, aab = sys.argv[1:]
          if native_headers(aab, "base/lib/") != native_headers(apk, "lib/"):
              sys.exit("AAB and APK differ in native library paths or ELF ABI headers")
          print("AAB native entries match the verified APK ABIs")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            dist/app-release-unsigned-signed.apk
            dist/app-release.aab
          if-no-files-found: error
          retention-days: 7

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist

      - name: Create unpublished GitHub release for review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/app-release-unsigned-signed.apk dist/app-release.aab \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes ''
