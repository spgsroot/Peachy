[package]
name = "peachy-adblock"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
perf-qa = []

[dependencies]
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
jni = "=0.21.1"
serde_json = "1"

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
